locale: "en-US"
title: "Zixuan Chen's Homepage"
title_separator: "-"
name: "Zixuan Chen"
description: "Zixuan Chen is a Ph.D. candidate in computer science at Shanghai Jiao Tong University, working on embodied AI, causality, and video object segmentation."
og_description: "Ph.D. candidate at Shanghai Jiao Tong University working on embodied AI, causality, and video object segmentation."
og_image: "og-image.png"
url: "https://zixuan-chen.github.io"
baseurl: ""
repository: "zixuan-chen/zixuan-chen.github.io"

# Optional: enables twitter:site / twitter:creator meta tags (username without the @)
# twitter:
#   username: "your_handle"

# Optional: enables the Person JSON-LD block in _includes/seo.html
# social:
#   type: Person
#   name: Zixuan Chen
#   links:
#     - https://scholar.google.com/citations?user=cMiTyacAAAAJ
#     - https://github.com/zixuan-chen

author_profile: true

author:
  avatar: "profile.jpg"
  name: "Zixuan Chen"
  bio: "Ph.D. Candidate @ SJTU"
  location: "Shanghai, China"
  employer: "Shanghai Jiao Tong University"
  email: "m13953842591@sjtu.edu.cn"
  googlescholar: "https://scholar.google.com/citations?user=cMiTyacAAAAJ"
  github: "zixuan-chen"
  # TODO: fill in your handles/IDs to show the matching icons in the sidebar
  # twitter: "your_handle"
  # linkedin: "your-id"
  # orcid: "0000-0000-0000-0000"
  # semantic: "your-semantic-scholar-id"

include:
  - .htaccess
  - _pages

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - files/README.md
  - Gemfile.lock
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development